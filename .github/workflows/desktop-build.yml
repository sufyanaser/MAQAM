name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - 'electron/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.cjs'
      - 'postcss.config.cjs'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build web app
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MAQAM-Lab-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct EXE release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.1.0'
          $asset = 'release/MAQAM-Lab-0.1.0-x64.exe'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset --target $env:GITHUB_SHA --title 'MAQAM Lab v0.1.0' --notes 'Windows x64 desktop installer for MAQAM Lab.' --prerelease --repo $env:GITHUB_REPOSITORY
          }
